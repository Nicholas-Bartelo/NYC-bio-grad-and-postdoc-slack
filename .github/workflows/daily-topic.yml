name: Daily Slack posts

on:
  schedule:
    # GitHub cron is UTC only. Fire at both offsets that can be 8:00 AM Eastern:
    # 12:00 UTC = 8 AM EDT, 13:00 UTC = 8 AM EST. Scripts post only when
    # America/New_York local hour is 8 (manual Run workflow always posts).
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: daily-slack-posts
  cancel-in-progress: false

jobs:
  topic:
    name: Topic of the Day
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Post Topic of the Day
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/post-daily-topic.mjs

  opportunities:
    name: Field opportunities
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Post opportunities
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SLACK_WEBHOOK_URL_OPPORTUNITIES_BIOTECH: ${{ secrets.SLACK_WEBHOOK_URL_OPPORTUNITIES_BIOTECH }}
          SLACK_WEBHOOK_URL_OPPORTUNITIES_VC: ${{ secrets.SLACK_WEBHOOK_URL_OPPORTUNITIES_VC }}
          SLACK_WEBHOOK_URL_OPPORTUNITIES_PHARMA: ${{ secrets.SLACK_WEBHOOK_URL_OPPORTUNITIES_PHARMA }}
          SLACK_WEBHOOK_URL_OPPORTUNITIES_ENTREPRENEURSHIP: ${{ secrets.SLACK_WEBHOOK_URL_OPPORTUNITIES_ENTREPRENEURSHIP }}
        run: node scripts/post-daily-opportunities.mjs
      - name: Commit posted-history
        if: success()
        run: |
          if git diff --quiet -- data/opportunities/posted-history.json; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities/posted-history.json
          git commit -m "Record posted opportunities ($(date -u +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
