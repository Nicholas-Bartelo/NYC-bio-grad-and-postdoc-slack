name: Daily Slack posts

on:
  # PRIMARY: external cron (cron-job.org) → repository_dispatch.
  # GitHub's own schedule trigger is often hours late or skipped on this repo.
  repository_dispatch:
    types: [daily-slack-posts]
  # BACKUP only — do not rely on this for 10am Eastern delivery.
  schedule:
    - cron: "0 14 * * *" # 10:00 EDT
    - cron: "0 15 * * *" # 10:00 EST
    - cron: "0 18 * * *" # afternoon catch-up if earlier ticks were skipped
  workflow_dispatch:
    inputs:
      force_repost:
        description: "Repost even if already posted today (Eastern date)"
        type: boolean
        default: false

concurrency:
  group: daily-slack-posts
  cancel-in-progress: false

jobs:
  daily:
    name: Topic + opportunities
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Show schedule context
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_REPOST: ${{ github.event.inputs.force_repost }}
        run: |
          node --input-type=module <<'EOF'
          import { easternDateKey, easternHour } from "./scripts/lib/eastern.mjs";
          console.log(
            JSON.stringify({
              event: process.env.GITHUB_EVENT_NAME,
              forceRepost: process.env.FORCE_REPOST,
              easternDate: easternDateKey(),
              easternHour: easternHour(),
              utc: new Date().toISOString(),
            }),
          );
          EOF
      - name: Post Topic of the Day
        env:
          # Prefer user token (editable posts). Webhooks remain as fallback.
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_CHANNEL_ID_TOPIC_OF_DAY: ${{ secrets.SLACK_CHANNEL_ID_TOPIC_OF_DAY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_REPOST: ${{ github.event.inputs.force_repost }}
        run: node scripts/post-daily-topic.mjs
      - name: Post opportunities
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_REPOST: ${{ github.event.inputs.force_repost }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_CHANNEL_ID_OPPORTUNITIES_BIOTECH: ${{ secrets.SLACK_CHANNEL_ID_OPPORTUNITIES_BIOTECH }}
          SLACK_CHANNEL_ID_OPPORTUNITIES_VC: ${{ secrets.SLACK_CHANNEL_ID_OPPORTUNITIES_VC }}
          SLACK_CHANNEL_ID_OPPORTUNITIES_PHARMA: ${{ secrets.SLACK_CHANNEL_ID_OPPORTUNITIES_PHARMA }}
          SLACK_CHANNEL_ID_OPPORTUNITIES_ENTREPRENEURSHIP: ${{ secrets.SLACK_CHANNEL_ID_OPPORTUNITIES_ENTREPRENEURSHIP }}
          SLACK_CHANNEL_ID_OPPORTUNITIES_SPATIAL: ${{ secrets.SLACK_CHANNEL_ID_OPPORTUNITIES_SPATIAL }}
          SLACK_WEBHOOK_URL_OPPORTUNITIES_BIOTECH: ${{ secrets.SLACK_WEBHOOK_URL_OPPORTUNITIES_BIOTECH }}
          SLACK_WEBHOOK_URL_OPPORTUNITIES_VC: ${{ secrets.SLACK_WEBHOOK_URL_OPPORTUNITIES_VC }}
          SLACK_WEBHOOK_URL_OPPORTUNITIES_PHARMA: ${{ secrets.SLACK_WEBHOOK_URL_OPPORTUNITIES_PHARMA }}
          SLACK_WEBHOOK_URL_OPPORTUNITIES_ENTREPRENEURSHIP: ${{ secrets.SLACK_WEBHOOK_URL_OPPORTUNITIES_ENTREPRENEURSHIP }}
          SLACK_WEBHOOK_URL_OPPORTUNITIES_SPATIAL: ${{ secrets.SLACK_WEBHOOK_URL_OPPORTUNITIES_SPATIAL }}
        run: node scripts/post-daily-opportunities.mjs
      - name: Commit posted history
        if: success()
        run: |
          CHANGED=0
          if ! git diff --quiet -- data/opportunities/posted-history.json 2>/dev/null; then
            CHANGED=1
          fi
          if ! git diff --quiet -- data/topic-last-posted.json 2>/dev/null; then
            CHANGED=1
          fi
          if [ -f data/topic-last-posted.json ] && ! git ls-files --error-unmatch data/topic-last-posted.json >/dev/null 2>&1; then
            CHANGED=1
          fi
          if [ "$CHANGED" -eq 0 ]; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities/posted-history.json data/topic-last-posted.json
          git commit -m "Record daily Slack posts ($(date -u +%F))" || {
            echo "Nothing to commit after staging."
            exit 0
          }
          git pull --rebase origin main
          git push origin HEAD:main
