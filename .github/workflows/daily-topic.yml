name: Daily biology topic

on:
  schedule:
    # GitHub cron is UTC only. Fire at both offsets that can be 8:00 AM Eastern:
    # 12:00 UTC = 8 AM EDT, 13:00 UTC = 8 AM EST. The script posts only when
    # America/New_York local hour is 8 (manual Run workflow always posts).
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Post Topic of the Day
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BIO_TOPIC_OF_DAY_CHANNEL_ID: ${{ secrets.BIO_TOPIC_OF_DAY_CHANNEL_ID }}
          BIO_TOPIC_OF_DAY_CHANNEL_NAME: topic-of-day
        run: node scripts/post-daily-topic.mjs
